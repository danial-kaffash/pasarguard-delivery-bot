# GitHub Actions CI for pasarguard-greet-bot.
#
# To enable: copy this file to .github/workflows/ci.yml and push that path
# with a token that has the `workflows` permission, e.g.:
#
#   mkdir -p .github/workflows
#   cp docs/github-ci.yml .github/workflows/ci.yml
#   git add .github && git commit -m "Enable CI" && git push
#
name: CI

on:
  push:
    branches: [main, "arena/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Format check (ruff)
        run: ruff format --check .
      - name: Tests
        run: pytest -q
