[project]
name = "pasarguard-greet-bot"
version = "0.1.0"
description = "Telegram bot: pinned channel promo + 5 GB on-hold trials on a PasarGuard xray panel"
requires-python = ">=3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
